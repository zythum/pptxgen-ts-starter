<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pptxgen-ts-starter — Slide Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --app-bg: #14141c;
        --surface: #1c1c27;
        --surface-raised: #252536;
        --surface-hover: #303047;
        --line: rgba(255, 255, 255, 0.09);
        --line-strong: rgba(255, 255, 255, 0.14);
        --text: #f4f3f8;
        --muted: #aaa9b8;
        --accent: #a99cff;
        --accent-soft: rgba(169, 156, 255, 0.16);
        --danger: #fca5a5;
        --radius: 12px;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      button {
        font: inherit;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* 文字选中高亮 — 浅于浏览器暗色默认值；不设 color，
         因为 ooxml 的透明选中层文字需保持透明以免与画布文字重影 */
      ::selection {
        background: rgba(169, 156, 255, 0.35);
      }

      /* ── Preview workspace ── */
      .pptx {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: var(--text);
        background: var(--app-bg);
      }

      .pptx-topbar {
        min-height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(28, 28, 39, 0.88);
      }

      .pptx-brand,
      .pptx-topbar-actions,
      .pptx-slide-meta,
      .notes-desk-header,
      .notes-desk-title,
      .pptx-floating-controls {
        display: flex;
        align-items: center;
      }

      .pptx-brand {
        min-width: 0;
        gap: 10px;
      }

      .pptx-brand-mark {
        width: 28px;
        height: 28px;
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid rgba(169, 156, 255, 0.45);
        border-radius: 8px;
        color: var(--accent);
        background: var(--accent-soft);
        font-size: 14px;
        font-weight: 800;
      }

      .pptx-brand-copy {
        min-width: 0;
      }

      .pptx-brand-title {
        overflow: hidden;
        color: var(--text);
        font-size: 13px;
        font-weight: 650;
        letter-spacing: -0.01em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pptx-brand-subtitle,
      .pptx-slide-meta,
      .notes-desk-kicker {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.3;
      }

      .pptx-brand-subtitle {
        margin-top: 1px;
      }

      .pptx-topbar-actions {
        gap: 8px;
        flex: 0 0 auto;
      }

      .pptx-icon-button,
      .pptx-control-button,
      .notes-close-button {
        display: inline-grid;
        place-items: center;
        border: 1px solid transparent;
        color: var(--muted);
        cursor: pointer;
        background: transparent;
        transition:
          background 160ms ease,
          border-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      .pptx-icon-button svg,
      .pptx-control-button svg,
      .notes-close-button svg {
        display: block;
      }

      .pptx-icon-button:hover,
      .pptx-control-button:hover,
      .notes-close-button:hover {
        border-color: var(--line-strong);
        color: var(--text);
        background: var(--surface-hover);
      }

      .pptx-icon-button:active,
      .pptx-control-button:active,
      .notes-close-button:active {
        transform: scale(0.96);
      }

      .pptx-icon-button {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        font-size: 17px;
      }

      .pptx-icon-button.active {
        border-color: rgba(169, 156, 255, 0.4);
        color: #d7d1ff;
        background: var(--accent-soft);
      }

      .pptx-workspace {
        min-height: 0;
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .pptx-stage {
        position: relative;
        min-width: 0;
        min-height: 0;
        flex: 1 1 auto;
        display: flex;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(169, 156, 255, 0.075), transparent 46%),
          var(--app-bg);
      }

      .pptx-canvas-wrapper {
        min-width: 0;
        min-height: 0;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 20px 20px 0;
      }

      .pptx-canvas-wrapper > div {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }

      .pptx-canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        box-shadow:
          0 22px 60px rgba(0, 0, 0, 0.4),
          0 0 0 1px rgba(255, 255, 255, 0.06);
      }

      .pptx-floating-controls {
        position: absolute;
        z-index: 5;
        bottom: 22px;
        left: 50%;
        gap: 4px;
        min-height: 46px;
        padding: 5px;
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        background: rgba(37, 37, 54, 0.92);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
        transform: translateX(-50%);
      }

      .pptx-control-button {
        min-width: 36px;
        height: 34px;
        border-radius: 9px;
        padding: 0 10px;
        font-size: 16px;
        font-weight: 600;
      }

      .pptx-control-button:disabled {
        cursor: not-allowed;
        opacity: 0.36;
      }

      .pptx-control-button:disabled:hover {
        border-color: transparent;
        color: var(--muted);
        background: transparent;
      }

      .pptx-control-divider {
        width: 1px;
        height: 22px;
        margin: 0 2px;
        background: var(--line-strong);
      }

      .pptx-slide-counter {
        min-width: 72px;
        padding: 0 7px;
        color: var(--text);
        font-size: 12px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      .notes-desk {
        width: 0;
        min-width: 0;
        flex: 0 0 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-left: 0 solid var(--line);
        color: var(--text);
        background: var(--surface);
        opacity: 0;
        transition:
          flex-basis 220ms ease,
          width 220ms ease,
          opacity 160ms ease,
          border-color 220ms ease;
      }

      .pptx.notes-open .notes-desk {
        width: min(360px, 34vw);
        flex-basis: min(360px, 34vw);
        border-left-width: 1px;
        opacity: 1;
      }

      .notes-desk-header {
        min-height: 76px;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 16px 14px 18px;
        border-bottom: 1px solid var(--line);
      }

      .notes-desk-title {
        min-width: 0;
        gap: 10px;
      }

      .notes-desk-indicator {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      .notes-desk-heading {
        overflow: hidden;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.01em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .notes-desk-kicker {
        margin-top: 2px;
      }

      .notes-close-button {
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        border-radius: 8px;
        font-size: 18px;
        line-height: 1;
      }

      .notes-desk-content {
        min-height: 0;
        flex: 1;
        overflow: auto;
        padding: 18px;
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      }

      .notes-text {
        color: #dedde6;
        font-size: 14px;
        line-height: 1.7;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .notes-text.is-empty {
        color: var(--muted);
        font-style: italic;
      }

      /* ── Error modal ── */
      .error-modal-overlay {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(7, 7, 10, 0.7);
        backdrop-filter: blur(8px);
      }

      .error-modal-overlay.active {
        display: flex;
      }

      .error-modal {
        width: min(900px, 100%);
        max-height: min(80vh, 720px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(252, 165, 165, 0.5);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.55);
      }

      .error-modal-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        color: var(--danger);
        font-size: 15px;
        font-weight: 700;
      }

      .error-modal-header .icon {
        font-size: 18px;
      }

      .error-modal-body {
        padding: 16px 20px;
        overflow-y: auto;
        color: #d7d5e1;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        line-height: 1.65;
        overflow-wrap: anywhere;
      }

      .error-modal-body .error-message {
        color: var(--danger);
        font-size: 13px;
        font-weight: 700;
        white-space: pre-wrap;
      }

      .error-modal-body .error-stack {
        padding-top: 12px;
        color: var(--muted);
        white-space: pre-wrap;
      }

      /* ── Fullscreen / Presentation mode ── */
      .pptx.fullscreen-mode .pptx-topbar {
        display: none;
      }

      .pptx.fullscreen-mode .notes-desk {
        display: none;
      }

      .pptx.fullscreen-mode .pptx-canvas-wrapper {
        padding: 0;
        background: #000;
      }

      .pptx.fullscreen-mode .pptx-stage {
        background: #000;
      }

      .pptx.fullscreen-mode .pptx-floating-controls {
        opacity: 0;
        transition: opacity 300ms ease;
      }

      .pptx.fullscreen-mode .pptx-stage:hover .pptx-floating-controls,
      .pptx.fullscreen-mode .pptx-floating-controls:focus-within {
        opacity: 1;
      }

      .pptx.fullscreen-mode .pptx-canvas {
        box-shadow: none;
      }

      .pptx.fullscreen-mode .pptx-notes-toggle,
      .pptx.fullscreen-mode .pptx-control-divider {
        display: none;
      }

      /* Fullscreen toast notification */
      .fullscreen-toast {
        position: fixed;
        z-index: 30;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        padding: 12px 20px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: rgba(37, 37, 54, 0.95);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        color: var(--text);
        font-size: 13px;
        font-weight: 500;
        opacity: 0;
        transition: transform 300ms ease, opacity 300ms ease;
        pointer-events: none;
      }

      .fullscreen-toast.visible {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

      @media (max-width: 760px) {
        .pptx-topbar {
          min-height: 52px;
          padding: 0 12px;
        }

        .pptx-brand-subtitle,
        .pptx-slide-meta {
          display: none;
        }

        .pptx-workspace {
          flex-direction: column;
        }

        .pptx-canvas-wrapper {
          padding: 18px 14px 72px;
        }

        .pptx-floating-controls {
          bottom: 16px;
        }

        .notes-desk {
          width: 100%;
          height: 0;
          flex: 0 0 0;
          border-top: 0 solid var(--line);
          border-left: 0;
        }

        .pptx.notes-open .notes-desk {
          width: 100%;
          height: min(38vh, 310px);
          flex-basis: min(38vh, 310px);
          border-top-width: 1px;
          border-left-width: 0;
        }

        .notes-desk-header {
          min-height: 62px;
          padding: 12px 14px;
        }

        .notes-desk-content {
          padding: 14px;
        }

        .notes-text {
          font-size: 13px;
          line-height: 1.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- ── Fullscreen Toast ── -->
    <div id="fullscreenToast" class="fullscreen-toast" role="alert" aria-live="polite"></div>

    <!-- ── Error Modal ── -->
    <div
      id="errorModal"
      class="error-modal-overlay"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="errorModalTitle"
    >
      <div class="error-modal">
        <div class="error-modal-header" id="errorModalTitle">
          <span class="icon" aria-hidden="true">⚠</span>
          <span>Generate Failed</span>
        </div>
        <div class="error-modal-body" id="errorModalBody"></div>
      </div>
    </div>

    <!-- Hot-reload: listen for file changes and auto-refresh -->
    <script>
      (function () {
        var es = new EventSource("/api/hot-reload");
        es.addEventListener("reload", function () {
          es.close();
          location.reload();
        });
        es.addEventListener("error", function () {
          // Reconnect on network error (EventSource retries automatically)
        });
      })();
    </script>

    <script type="module">
      import { PptxViewer } from "https://esm.sh/@silurus/ooxml@0.75.5/pptx";

      // ── Error modal ──
      const errorModal = document.getElementById("errorModal");
      const errorModalBody = document.getElementById("errorModalBody");

      function showError(err, stack) {
        const parts = [""];
        parts.push(`<div class="error-message">${escapeHtml(err.message)}</div>`);
        const st = stack ?? err.stack;
        if (st) parts.push(`<div class="error-stack">${escapeHtml(st)}</div>`);
        errorModalBody.innerHTML = parts.join("\n");
        errorModal.classList.add("active");
        console.error(err);
      }

      function escapeHtml(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      // ── State ──
      let viewer = null;
      let notesOpen = false;

      async function renderPreview(domElement) {
        domElement.innerHTML = `
          <div class="pptx">
            <header class="pptx-topbar">
              <div class="pptx-brand">
                <span class="pptx-brand-mark" aria-hidden="true">P</span>
                <div class="pptx-brand-copy">
                  <div class="pptx-brand-title">Slide Preview</div>
                  <div class="pptx-brand-subtitle">pptxgen-ts-starter</div>
                </div>
              </div>
              <div class="pptx-topbar-actions">
                <span class="pptx-slide-meta pptx-slide-title">Preparing preview…</span>
              </div>
            </header>
            <div class="pptx-workspace">
              <main class="pptx-stage" aria-label="Slide preview">
                <div class="pptx-canvas-wrapper">
                  <canvas class="pptx-canvas"></canvas>
                </div>
                <div class="pptx-floating-controls" aria-label="Slide controls">
                  <button class="pptx-control-button pptx-prev-btn" type="button" aria-label="Previous slide" title="Previous slide (←)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
                  <span class="pptx-slide-counter pptx-counter" aria-live="polite">Loading…</span>
                  <button class="pptx-control-button pptx-next-btn" type="button" aria-label="Next slide" title="Next slide (→)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
                  <span class="pptx-control-divider" aria-hidden="true"></span>
                  <button class="pptx-control-button pptx-notes-toggle" type="button" aria-label="Show speaker notes" aria-expanded="false" title="Show speaker notes (N)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9.5 8h5"/><path d="M9.5 12H16"/><path d="M9.5 16H14"/></svg></button>
                  <button class="pptx-control-button pptx-fullscreen-btn" type="button" aria-label="Fullscreen presentation" title="Fullscreen presentation (F5)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
                </div>
              </main>
              <aside class="notes-desk" aria-label="Speaker notes" aria-hidden="true">
                <div class="notes-desk-header">
                  <div class="notes-desk-title">
                    <span class="notes-desk-indicator" aria-hidden="true"></span>
                    <div>
                      <div class="notes-desk-heading">Speaker notes</div>
                      <div class="notes-desk-kicker notes-slide-label">Slide —</div>
                    </div>
                  </div>
                  <button class="notes-close-button" type="button" aria-label="Hide speaker notes" title="Hide speaker notes (N)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
                </div>
                <div class="notes-desk-content">
                  <p class="notes-text is-empty">Notes will appear here when the preview is ready.</p>
                </div>
              </aside>
            </div>
          </div>
        `;

        const app = domElement.querySelector(".pptx");
        const canvas = domElement.querySelector(".pptx-canvas");
        const wrapper = domElement.querySelector(".pptx-canvas-wrapper");
        const counter = domElement.querySelector(".pptx-counter");
        const slideTitle = domElement.querySelector(".pptx-slide-title");
        const notesLabel = domElement.querySelector(".notes-slide-label");
        const notesDesk = domElement.querySelector(".notes-desk");
        const notesText = domElement.querySelector(".notes-text");
        const prevBtn = domElement.querySelector(".pptx-prev-btn");
        const nextBtn = domElement.querySelector(".pptx-next-btn");
        const notesCloseBtn = domElement.querySelector(".notes-close-button");
        const notesToggleBtns = domElement.querySelectorAll(".pptx-notes-toggle");
        const compactViewport = window.matchMedia("(max-width: 760px)");

        function setNotesOpen(open) {
          notesOpen = open;
          app.classList.toggle("notes-open", open);
          notesDesk.setAttribute("aria-hidden", String(!open));
          notesToggleBtns.forEach((button) => {
            button.classList.toggle("active", open);
            button.setAttribute("aria-expanded", String(open));
            button.setAttribute("aria-label", open ? "Hide speaker notes" : "Show speaker notes");
            button.title = `${open ? "Hide" : "Show"} speaker notes (N)`;
          });
          window.requestAnimationFrame(() => void viewer?.fitPage());
        }

        function updateNotes(slideIndex, total) {
          const notes = viewer?.getNotes(slideIndex) ?? "";
          notesText.textContent = notes || "This slide does not contain speaker notes.";
          notesText.classList.toggle("is-empty", !notes);
          notesLabel.textContent = `Slide ${slideIndex + 1} of ${total}`;
        }

        function updateSlideUi(slideIndex, total) {
          counter.textContent = `${slideIndex + 1} / ${total}`;
          slideTitle.textContent = `Slide ${String(slideIndex + 1)} · ${total} total`;
          prevBtn.disabled = slideIndex === 0;
          nextBtn.disabled = slideIndex === total - 1;
          updateNotes(slideIndex, total);
        }

        function toggleNotes() {
          setNotesOpen(!notesOpen);
        }

        counter.textContent = "Generating…";
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        setNotesOpen(!compactViewport.matches);

        try {
          // Fetch pre-generated .pptx from server.
          const resp = await fetch("/api/generate");
          const contentType = resp.headers.get("Content-Type") || "";
          if (!resp.ok) {
            if (contentType.includes("json")) {
              const errData = await resp.json();
              const err = new Error(errData.error);
              counter.textContent = "Error";
              showError(err, errData.stack);
              return;
            }
            throw new Error(`Server error: ${resp.status} ${resp.statusText}`);
          }

          const buffer = await resp.arrayBuffer();
          counter.textContent = "Rendering…";

          const targetSlide = parseInt(location.hash.replace("#", ""), 10) || 1;
          let suppressHashUpdate = true;

          viewer = new PptxViewer(canvas, {
            useGoogleFonts: true,
            enableTextSelection: true,
            onSlideChange: (current, total) => {
              updateSlideUi(current, total);
              if (!suppressHashUpdate) {
                history.replaceState(null, "", `#${current + 1}`);
              }
            },
          });

          await viewer.load(buffer);
          await viewer.fitPage();

          const resizeObserver = new ResizeObserver(() => void viewer?.fitPage());
          resizeObserver.observe(wrapper);

          if (targetSlide > 1) await viewer.goToSlide(targetSlide - 1);
          suppressHashUpdate = false;
        } catch (err) {
          counter.textContent = "Error — see modal";
          showError(err, null);
          return;
        }

        prevBtn.addEventListener("click", () => void viewer?.prevSlide());
        nextBtn.addEventListener("click", () => void viewer?.nextSlide());
        notesCloseBtn.addEventListener("click", () => setNotesOpen(false));
        notesToggleBtns.forEach((button) => button.addEventListener("click", toggleNotes));

        // ── Fullscreen presentation mode ──
        const fullscreenBtn = domElement.querySelector(".pptx-fullscreen-btn");
        const fullscreenToast = document.getElementById("fullscreenToast");
        let toastTimer = null;

        function showToast(message) {
          fullscreenToast.textContent = message;
          fullscreenToast.classList.add("visible");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            fullscreenToast.classList.remove("visible");
          }, 3000);
        }

        function isFullscreenSupported() {
          return !!(
            document.fullscreenEnabled ??
            document.webkitFullscreenEnabled
          );
        }

        function isInFullscreen() {
          return !!(document.fullscreenElement ?? document.webkitFullscreenElement);
        }

        function enterFullscreen() {
          if (!isFullscreenSupported()) {
            showToast("⚠ 当前浏览器不支持全屏功能，请使用 Chrome/Firefox/Edge 等现代浏览器");
            return;
          }
          const el = document.documentElement;
          const request = el.requestFullscreen ?? el.webkitRequestFullscreen;
          if (request) {
            request.call(el).catch(() => {
              showToast("⚠ 全屏请求被拒绝，请检查浏览器权限设置");
            });
          }
        }

        function exitFullscreen() {
          const exit = document.exitFullscreen ?? document.webkitExitFullscreen;
          if (exit) exit.call(document);
        }

        function toggleFullscreen() {
          if (isInFullscreen()) {
            exitFullscreen();
          } else {
            enterFullscreen();
          }
        }

        function onFullscreenChange() {
          const inFs = isInFullscreen();
          app.classList.toggle("fullscreen-mode", inFs);
          fullscreenBtn.setAttribute("aria-label", inFs ? "Exit fullscreen" : "Fullscreen presentation");
          fullscreenBtn.title = inFs ? "Exit fullscreen (Esc)" : "Fullscreen presentation (F5)";
          fullscreenBtn.innerHTML = inFs
            ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>'
            : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
          window.requestAnimationFrame(() => void viewer?.fitPage());
        }

        document.addEventListener("fullscreenchange", onFullscreenChange);
        document.addEventListener("webkitfullscreenchange", onFullscreenChange);
        fullscreenBtn.addEventListener("click", toggleFullscreen);

        compactViewport.addEventListener("change", (event) => {
          if (event.matches) setNotesOpen(false);
        });

        document.addEventListener("keydown", (event) => {
          if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) return;
          if (
            event.target instanceof HTMLElement &&
            event.target.closest("button, input, textarea, select, a")
          )
            return;

          if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
            void viewer?.prevSlide();
          } else if (event.key === "ArrowRight" || event.key === "ArrowDown" || event.key === " ") {
            event.preventDefault();
            void viewer?.nextSlide();
          } else if (event.key.toLowerCase() === "n") {
            if (!isInFullscreen()) toggleNotes();
          } else if (event.key.toLowerCase() === "f") {
            void viewer?.fitPage();
          } else if (event.key === "F5") {
            event.preventDefault();
            enterFullscreen();
          } else if (event.key === "Escape" && isInFullscreen()) {
            exitFullscreen();
          }
        });
      }

      renderPreview(document.getElementById("root"));
    </script>
  </body>
</html>
